name: Refresh official research data
on:
  schedule:
    - cron: '37 3 * * 2-6'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: node --test tests/*.test.mjs
      - name: Fetch and validate official evidence
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/build_research.py
      - name: Archive the source evidence for this run
        uses: actions/upload-artifact@v4
        with:
          name: official-source-evidence
          path: |
            local-data/sec/CIK*.json
            local-data/treasury-*.xml
            local-data/research-sources.json
          retention-days: 30
      - name: Record the new snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/research.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh official financial research snapshot'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
