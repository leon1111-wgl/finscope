name: Universe probe
# One-off facts for the 0.3.0 universe design (docs/UNIVERSE.md): endpoints, pool size, filer categories.
# Changes nothing and never deploys.
on:
  push:
    branches: [universe-2026-11]
    paths: [scripts/probes/universe_probe.py, .github/workflows/universe-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/probes/universe_probe.py
